name: Streak reminders

# Every 30 minutes, because the reminder window is an evening one in each player's own timezone
# and every hour is somebody's evening. Vercel's built-in cron allows one run per day on the
# Hobby plan, which is why the trigger lives here; the endpoint itself is plan-agnostic.
#
# The rate asked for and the rate delivered are different things. GitHub's cron is best-effort
# and drops runs under load: this workflow was first set to hourly and produced four runs in
# eight hours, spaced around three hours apart, none of them near the requested minute. Asking
# twice as often buys more chances at the queue; the endpoint is idempotent and each player can
# be messaged at most once per local day, so extra runs cost nothing but a no-op request. The
# real defence is on the other side — the eligibility window in notifications.ts is deliberately
# wider than the observed jitter.
#
# Deliberately off the hour and half-hour: scheduled runs bunch up worst at :00.
#
# Note that GitHub disables scheduled workflows in repositories with no activity for 60 days.
on:
  schedule:
    - cron: "17,47 * * * *"
  workflow_dispatch: # so it can be triggered by hand while testing

jobs:
  remind:
    runs-on: ubuntu-latest
    steps:
      # Without this the failure mode is a bare 401, which looks identical to a wrong token.
      - name: Check that the secret exists
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          if [ -z "$CRON_SECRET" ]; then
            echo "::error::CRON_SECRET is not set. Add it under Settings -> Secrets and variables -> Actions (repository secret, exact name CRON_SECRET), matching the value in the Vercel project."
            exit 1
          fi

      - name: Trigger streak reminders
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
        run: |
          response=$(curl --silent --show-error --fail-with-body \
            --max-time 60 \
            --write-out "\n%{http_code}" \
            --header "Authorization: Bearer $CRON_SECRET" \
            https://walkpet.vercel.app/api/cron/streak-reminder)
          echo "$response"
